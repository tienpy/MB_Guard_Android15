name: Build Tien Utility APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'callrecorder/**'
      - 'shakeactions/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-utilities.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore signing key
        shell: bash
        run: |
          mkdir -p signing
          base64 -d signing/mbguard15.p12.b64 > signing/mbguard15.p12

      - name: Build both release APKs
        run: gradle --no-daemon :callrecorder:assembleRelease :shakeactions:assembleRelease

      - name: Prepare APK files
        run: |
          cp callrecorder/build/outputs/apk/release/callrecorder-release.apk Tien_Call_Recorder_v1.3.0.apk
          cp shakeactions/build/outputs/apk/release/shakeactions-release.apk Tien_Gesture_Actions_v2.0.1.apk

      - name: Upload Call Recorder
        uses: actions/upload-artifact@v4
        with:
          name: Tien_Call_Recorder_v1.3.0
          path: Tien_Call_Recorder_v1.3.0.apk
          if-no-files-found: error

      - name: Upload Shake Actions
        uses: actions/upload-artifact@v4
        with:
          name: Tien_Gesture_Actions_v2.0.1
          path: Tien_Gesture_Actions_v2.0.1.apk
          if-no-files-found: error
