name: Build Auto Skip Paste APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'autoskip/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-autoskip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore signing key
        shell: bash
        run: |
          mkdir -p signing
          base64 -d signing/mbguard15.p12.b64 > signing/mbguard15.p12

      - name: Build signed APK
        run: gradle --no-daemon :autoskip:assembleRelease

      - name: Prepare APK
        run: cp autoskip/build/outputs/apk/release/autoskip-release.apk Auto_Skip_Paste_v1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Auto_Skip_Paste_v1.1.0
          path: Auto_Skip_Paste_v1.1.0.apk
          if-no-files-found: error
